{% extends 'base.html' %}

{% block title %}Реєстрація - BrLog{% endblock %}

{% block content %}
    <h1>Реєстрація</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Зареєструватися</button>
    </form>
    <p style="margin-top: 20px;">Вже є акаунт? <a href="{% url 'login' %}">Увійдіть</a>.</p>
{% endblock %}
